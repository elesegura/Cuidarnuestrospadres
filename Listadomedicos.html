        function renderMedicos(lista) {
            const container = document.getElementById('gridContainer');
            document.getElementById('counter').innerText = lista.length;
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">No se encontraron resultados para tu búsqueda.</p>';
                return;
            }

            lista.forEach(m => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">${m.especialidad}</span>
                            <span class="text-xs text-gray-500 font-medium">${m.barrio}</span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-900 mb-1">${m.nombre}</h3>
                        <p class="text-sm text-gray-600 mb-2">📍 ${m.lugar}</p>
                        <p class="text-sm text-gray-800 mb-3 font-semibold">📞 ${m.contacto}</p>
                        ${m.notas ? `<p class="text-xs text-gray-500 bg-gray-50 p-2.5 rounded-lg mb-3">💬 ${m.notas}</p>` : ''}
                    </div>
                    ${m.pami ? `<div class="mt-2 text-xs font-bold text-green-700 bg-green-50 px-2.5 py-1 rounded inline-block w-max">Atiende por PAMI: ${m.pami}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // Búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = medicos.filter(m => {
                return Object.values(m).some(val => String(val).toLowerCase().includes(texto));
            });
            renderMedicos(filtrados);
        });

        // Inicializar la vista
        renderMedicos(medicos);
